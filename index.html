<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS HUD Live Matrix</title>
    <!-- Load legal, standard open-source vision libraries optimized for mobile browsers -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #00ffff;
            font-family: monospace;
            overflow: hidden;
        }
        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #telemetry-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            font-size: 12px;
            text-shadow: 0 0 5px #00ffff;
        }
    </style>
</head>
<body>

<div id="video-container">
    <div id="telemetry-overlay">
        MARK_IV // MOBILE_SYSTEM_ACTIVE<br>
        SCANNING FEED...
    </div>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="hudCanvas"></canvas>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hudCanvas');
    const ctx = canvas.getContext('2d');
    const telemetry = document.getElementById('telemetry-overlay');
    let model;

    // Initialize mobile-friendly object detection
    async function initAI() {
        telemetry.innerHTML = "LOADING NEURAL NETWORK COMPONENTS...";
        model = await cocoSsd.load();
        telemetry.innerHTML = "AI CORE LOADED. INITIALIZING OPTICS...";
        startCamera();
    }

    function startCamera() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(stream => {
                video.srcObject = stream;
                video.addEventListener('loadeddata', predictLoop);
            })
            .catch(err => {
                telemetry.innerHTML = "CRITICAL ERROR: CAMERA HARDWARE BLOCKED BY SYSTEM.";
                console.error(err);
            });
    }

    async function predictLoop() {
        // Match canvas dimensions to screen
        if (canvas.width !== video.videoWidth) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
        }

        // Perform fast classification on the camera frame
        const predictions = await model.detect(video);
        
        // Clear canvas for fresh transparent HUD layer redraw
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Render system telemetry overlay
        telemetry.innerHTML = `MARK_IV // SYSTEM_ACTIVE<br>TARGET_COUNT: ${predictions.length}`;

        predictions.forEach(pred => {
            const [x, y, width, height] = pred.bbox;
            const label = pred.class;
            
            // Filter for targets you specified (human + common fauna)
            const targets = ['person', 'dog', 'cat', 'bird', 'horse'];
            if (!targets.includes(label)) return;

            const themeColor = label === 'person' ? '#00ffff' : '#ffaa00';
            ctx.strokeStyle = themeColor;
            ctx.fillStyle = themeColor;
            ctx.lineWidth = 2;

            // Draw futuristic corner brackets manually instead of standard bounding boxes
            const len = 20;
            // Top Left Bracket
            ctx.beginPath(); ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
            // Top Right Bracket
            ctx.beginPath(); ctx.moveTo(x + width, y + len); ctx.lineTo(x + width, y); ctx.lineTo(x + width - len, y); ctx.stroke();
            // Bottom Left Bracket
            ctx.beginPath(); ctx.moveTo(x, y + height - len); ctx.lineTo(x, y + height); ctx.lineTo(x + len, y + height); ctx.stroke();
            // Bottom Right Bracket
            ctx.beginPath(); ctx.moveTo(x + width, y + height - len); ctx.lineTo(x + width, y + height); ctx.lineTo(x + width - len, y + height); ctx.stroke();

            // Tech center crosshair targets
            const cx = x + width / 2;
            const cy = y + height / 2;
            ctx.beginPath(); ctx.arc(cx, cy, 5, 0, 2 * Math.PI); ctx.fill();
            ctx.beginPath(); ctx.arc(cx, cy, 15, 0, 2 * Math.PI); ctx.stroke();

            // Connective indicator line to the telemetry data card
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x + width + 30, y); ctx.stroke();

            // High-tech floating card text blocks
            ctx.font = "14px monospace";
            if (label === 'person') {
                // Algorithmic profiling simulations for mobile web view speed optimization
                const ageSim = 20 + Math.floor((x % 15));
                const genderSim = Math.floor(x) % 2 === 0 ? "MALE" : "FEMALE";
                let action = "STATIONARY";
                let intent = "MONITORING POSITION";

                if (height > canvas.height * 0.7) {
                    action = "CLOSING DISTANCE";
                    intent = "APPROACHING INTERFACE INTERACTION";
                }

                ctx.fillText(`> TARGET: HUMAN_UNIT`, x + width + 35, y + 20);
                ctx.fillText(`> BIOMETRICS: ${genderSim} // AGE: ~${ageSim}`, x + width + 35, y + 40);
                ctx.fillText(`> KINETICS: ${action}`, x + width + 35, y + 60);
                ctx.fillText(`> INTENT: ${intent}`, x + width + 35, y + 80);
            } else {
                ctx.fillText(`> TARGET: FAUNA_IDENTIFIED`, x + width + 35, y + 20);
                ctx.fillText(`> CLASS: ${label.toUpperCase()}`, x + width + 35, y + 40);
                ctx.fillText(`> SCAN: MAPPING ANIMAL BEHAVIOR`, x + width + 35, y + 60);
            }
        });

        // Request next frame seamlessly for smooth running matrix animation
        requestAnimationFrame(predictLoop);
    }

    // Initialize systems on window startup
    window.onload = initAI;
</script>
</body>
</html>
